<!doctype html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Neue Anfrage über niktos.com</title>
<style>
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .px { padding-left: 20px !important; padding-right: 20px !important; }
    .lbl { display: block !important; width: auto !important; padding: 14px 0 2px !important; border-bottom: 0 !important; }
    .val { display: block !important; padding: 0 0 14px !important; }
    .h1 { font-size: 23px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#eef0f6; -webkit-text-size-adjust:100%;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef0f6" style="background-color:#eef0f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:18px; overflow:hidden;">

        <tr>
          <td class="px" align="left" bgcolor="#ffffff" style="padding:22px 32px 18px; background-color:#ffffff;">
            <img src="{{logo_url}}" height="48" alt="Niktos" style="display:block; height:48px; width:auto; border:0; outline:none; text-decoration:none;">
          </td>
        </tr>

        <tr>
          <td class="px" bgcolor="#0a0c14" style="padding:28px 32px; background-color:#0a0c14; border-bottom:6px solid #0a6cff;">
            <p style="margin:0 0 8px; font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#7fa2ff;">Neue Website-Anfrage</p>
            <h1 class="h1" style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:26px; line-height:1.2; font-weight:bold; color:#ffffff;">{{topic}}</h1>
            <p style="margin:8px 0 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.4; color:#b9c1d0;">{{datum}}</p>
          </td>
        </tr>

        <tr>
          <td class="px" style="padding:24px 32px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{{rows}}
            </table>
          </td>
        </tr>

        <tr>
          <td class="px" style="padding:16px 32px 8px;">
            <p style="margin:0 0 12px; font-family:Arial, Helvetica, sans-serif; font-size:13px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:#6b7285;">Kunde direkt kontaktieren</p>
{{buttons}}
          </td>
        </tr>

        <tr>
          <td class="px" style="padding:18px 32px 26px; border-top:1px solid #e6e8ef;">
            <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; color:#8a90a0;">
              Gesendet über <a href="{{site_url}}" style="color:#0a6cff; text-decoration:underline;">niktos.com</a>.<br>
              {{reply_hint}}
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
